name: Daily jobs

# 06:00 IST — due-soon/overdue notifications (and later Pulse snapshots). Also keeps the free
# Supabase project from auto-pausing. Requires repository secrets APP_URL and CRON_SECRET;
# the job is skipped (not failed) until they are configured.
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check configuration
        id: cfg
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_URL / CRON_SECRET secrets not set — skipping (no deployment configured yet)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Call /api/cron/daily
        if: steps.cfg.outputs.run == 'true'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL%/}/api/cron/daily")
          cat /tmp/out.json; echo
          test "$code" = "200"
